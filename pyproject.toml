[project]
name = "clippie"
version = "0.1.0"
description = "A local clip-selection workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "google-auth[requests]>=2.45,<3",
    "yt-dlp>=2025.10.14",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "python-multipart>=0.0.20",
    "opentelemetry-sdk>=1.38,<2",
    "keyring>=25,<27; sys_platform == 'darwin'",
]

[project.optional-dependencies]
local = ["mlx-whisper>=0.4.2"]
semantic = ["sentence-transformers[image]>=5.0", "transformers>=5.18", "soundfile>=0.13"]
editor = ["mlx-lm>=0.30,<1"]
vision = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8,<10", "cryptography>=43"]

[project.scripts]
clippie = "clippie.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clippie"]

[tool.pytest.ini_options]
testpaths = ["tests", "cloud/tests"]
pythonpath = ["cloud"]
